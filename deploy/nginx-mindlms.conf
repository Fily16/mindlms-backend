# nginx como proxy inverso de la API de MindLMS.
#
# Instalación en la VM:
#   sudo cp deploy/nginx-mindlms.conf /etc/nginx/sites-available/mindlms
#   sudo ln -s /etc/nginx/sites-available/mindlms /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d <TU_DOMINIO>     # añade el bloque SSL solo
#
# HTTPS no es opcional: el frontend se sirve por HTTPS desde Vercel y el
# navegador bloquea las llamadas a un backend HTTP (mixed content).
# Sin dominio propio sirve un dominio de sslip.io o DuckDNS, que Let's
# Encrypt acepta.

server {
    listen 80;
    server_name <TU_DOMINIO>;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Server-Sent Events (GET /api/v1/ml/detect/events) ---
        # Sin esto nginx acumula el stream en su buffer y el dashboard no
        # recibe las alertas en vivo: se quedan retenidas hasta que la
        # conexión se cierra. Es el fallo más típico de SSE tras un proxy.
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # El backend emite un keepalive cada 30 s; el timeout debe ser
        # mayor o nginx cortaría la conexión a los 60 s por defecto.
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        # HTTP/1.1 es obligatorio para mantener la conexión abierta.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
